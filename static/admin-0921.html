<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tourney Farm Analytics</title>

    <style>
        :root {
            --background: #0f172a;
            --card: #1f2937;
            --card-light: #273244;
            --primary: #f59e0b;
            --primary-light: #fbbf24;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(245, 158, 11, 0.15),
                    transparent 30%
                ),
                linear-gradient(
                    180deg,
                    #0f172a 0%,
                    #111827 100%
                );
            color: var(--text);
        }

        .container {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0 60px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0;
            color: var(--primary-light);
            font-size: 34px;
        }

        .header p {
            margin: 8px 0 0;
            color: var(--muted);
        }

        .refresh-button {
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            background: linear-gradient(
                135deg,
                var(--primary),
                #f97316
            );
            color: #111827;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .refresh-button:hover {
            filter: brightness(1.08);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 22px;
        }

        .stat-card,
        .section-card {
            background: linear-gradient(
                180deg,
                var(--card-light),
                var(--card)
            );
            border: 1px solid rgba(245, 158, 11, 0.18);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .stat-card {
            padding: 22px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .stat-value {
            margin-top: 8px;
            color: var(--primary-light);
            font-size: 44px;
            font-weight: 800;
        }

        .section-card {
            padding: 22px;
            margin-bottom: 22px;
        }

        .section-card h2 {
            margin: 0 0 18px;
            font-size: 22px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            color: var(--primary-light);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        td {
            color: #e5e7eb;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        .count-cell {
            width: 100px;
            font-weight: 800;
            color: var(--primary-light);
        }

        .message {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
            background: rgba(17, 24, 39, 0.65);
        }

        .error {
            color: #fecaca;
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(127, 29, 29, 0.22);
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            padding-top: 10px;
        }

        @media (max-width: 750px) {
            .container {
                width: min(100% - 20px, 1100px);
                padding-top: 24px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .refresh-button {
                width: 100%;
            }

            .header h1 {
                font-size: 28px;
            }

            .stat-value {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="header">
            <div>
                <h1>Tourney Farm Analytics</h1>
                <p>Live search activity from Tourney Farm.</p>
            </div>

            <button
                type="button"
                class="refresh-button"
                onclick="loadAnalytics()"
            >
                Refresh Data
            </button>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Searches</div>
                <div class="stat-value" id="totalSearches">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Unique Search Terms</div>
                <div class="stat-value" id="uniqueSearches">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Latest Search</div>
                <div
                    class="stat-value"
                    id="latestSearch"
                    style="font-size: 26px;"
                >
                    None
                </div>
            </div>
        </section>

        <section class="section-card">
            <h2>Top Searches</h2>

            <div id="topSearchMessage" class="message">
                Loading analytics...
            </div>

            <div
                id="topSearchTable"
                class="table-wrapper"
                hidden
            >
                <table>
                    <thead>
                        <tr>
                            <th>Search Term</th>
                            <th>Count</th>
                        </tr>
                    </thead>

                    <tbody id="topSearches"></tbody>
                </table>
            </div>
        </section>

        <section class="section-card">
            <h2>Recent Searches</h2>

            <div id="recentSearchMessage" class="message">
                Loading analytics...
            </div>

            <div
                id="recentSearchTable"
                class="table-wrapper"
                hidden
            >
                <table>
                    <thead>
                        <tr>
                            <th>Search Term</th>
                            <th>Date and Time</th>
                        </tr>
                    </thead>

                    <tbody id="recentSearches"></tbody>
                </table>
            </div>
        </section>

        <div class="footer">
            Tourney Farm analytics dashboard
        </div>
    </main>

    <script>
        const analyticsUrl =
            "https://tourney-farm.onrender.com/api/analytics/summary";

        function escapeHtml(value) {
            const element = document.createElement("div");
            element.textContent = value ?? "";
            return element.innerHTML;
        }

        function formatTimestamp(timestamp) {
            if (!timestamp) {
                return "Unavailable";
            }

            const utcTimestamp = timestamp.includes("T")
                ? timestamp
                : timestamp.replace(" ", "T") + "Z";

            const date = new Date(utcTimestamp);

            if (Number.isNaN(date.getTime())) {
                return timestamp;
            }

            return date.toLocaleString("en-US", {
                month: "short",
                day: "numeric",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit"
            });
        }

        async function loadAnalytics() {
            const topMessage =
                document.getElementById("topSearchMessage");

            const recentMessage =
                document.getElementById("recentSearchMessage");

            const topTable =
                document.getElementById("topSearchTable");

            const recentTable =
                document.getElementById("recentSearchTable");

            topMessage.hidden = false;
            recentMessage.hidden = false;
            topTable.hidden = true;
            recentTable.hidden = true;

            topMessage.className = "message";
            recentMessage.className = "message";

            topMessage.textContent = "Loading analytics...";
            recentMessage.textContent = "Loading analytics...";

            try {
                const response = await fetch(analyticsUrl);

                if (!response.ok) {
                    throw new Error(
                        "Analytics request failed with status " +
                        response.status
                    );
                }

                const data = await response.json();

                const topSearches =
                    Array.isArray(data.top_searches)
                        ? data.top_searches
                        : [];

                const recentSearches =
                    Array.isArray(data.recent_searches)
                        ? data.recent_searches
                        : [];

                document.getElementById(
                    "totalSearches"
                ).textContent = data.total_searches ?? 0;

                document.getElementById(
                    "uniqueSearches"
                ).textContent = topSearches.length;

                document.getElementById(
                    "latestSearch"
                ).textContent = recentSearches.length > 0
                    ? recentSearches[0].event_value
                    : "None";

                if (topSearches.length > 0) {
                    document.getElementById(
                        "topSearches"
                    ).innerHTML = topSearches.map(function (item) {
                        return `
                            <tr>
                                <td>${escapeHtml(item.event_value)}</td>
                                <td class="count-cell">
                                    ${escapeHtml(item.searches)}
                                </td>
                            </tr>
                        `;
                    }).join("");

                    topMessage.hidden = true;
                    topTable.hidden = false;
                } else {
                    topMessage.textContent =
                        "No searches have been recorded yet.";
                }

                if (recentSearches.length > 0) {
                    document.getElementById(
                        "recentSearches"
                    ).innerHTML = recentSearches.map(function (item) {
                        return `
                            <tr>
                                <td>${escapeHtml(item.event_value)}</td>
                                <td>
                                    ${escapeHtml(
                                        formatTimestamp(item.created_at)
                                    )}
                                </td>
                            </tr>
                        `;
                    }).join("");

                    recentMessage.hidden = true;
                    recentTable.hidden = false;
                } else {
                    recentMessage.textContent =
                        "No recent searches are available.";
                }
            } catch (error) {
                console.error("Unable to load analytics:", error);

                document.getElementById(
                    "totalSearches"
                ).textContent = "Error";

                topMessage.className = "message error";
                recentMessage.className = "message error";

                topMessage.textContent =
                    "The analytics data could not be loaded. " +
                    "Check the API summary endpoint.";

                recentMessage.textContent =
                    "Error details: " + error.message;
            }
        }

        loadAnalytics();
    </script>
</body>
</html>
